name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check pathdog pathdog.py tests
      - name: Build distributions
        run: python -m build
      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          pathdog --help
      - name: Audit runtime dependencies
        run: pip-audit --requirement requirements.txt

  bloodhound-oracle:
    name: BloodHound 9.5.1 fixture oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Pathdog
        run: python -m pip install .
      - name: Download pinned official Version 6 ADCS fixture
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/bloodhound-version6-adcs.zip \
            https://raw.githubusercontent.com/SpecterOps/BloodHound/ecccc9fdb19df5af8a589d407dc5f3b5a4e57202/cmd/api/src/services/graphify/fixtures/Version6ADCSZIP/raw/archive.zip
          echo "8b37f581bf364410253e78f20d8e031f6399f4bdde5a6057130189b24ac24df1  /tmp/bloodhound-version6-adcs.zip" | sha256sum --check
      - name: Compare Pathdog with the official ingestion/analysis oracle
        env:
          BLOODHOUND_ADCS_FIXTURE: /tmp/bloodhound-version6-adcs.zip
        run: python -m unittest tests.test_official_fixture -v
